<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <defs>
    <style>
      .outline {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bg {
        fill: #f8fafc;
      }
    </style>
  </defs>

  <!-- Fondo -->
  <rect class="bg" x="0" y="0" width="400" height="800" rx="24"></rect>

  <!-- Cuerpo simplificado -->
  <!-- Cabeza -->
  <circle class="outline" cx="200" cy="90" r="40"></circle>

  <!-- Cuello y torso -->
  <path class="outline" d="
    M 170 130
    Q 200 140 230 130
    L 250 210
    Q 260 250 260 300
    L 260 420
    Q 260 460 240 520
    L 220 600
    Q 210 640 200 640
    Q 190 640 180 600
    L 160 520
    Q 140 460 140 420
    L 140 300
    Q 140 250 150 210
    Z
  "></path>

  <!-- Brazo izquierdo -->
  <path class="outline" d="
    M 150 210
    L 110 260
    Q 90 280 90 310
    L 90 360
    Q 90 380 100 400
    L 110 420
  "></path>

  <!-- Brazo derecho -->
  <path class="outline" d="
    M 250 210
    L 290 260
    Q 310 280 310 310
    L 310 360
    Q 310 380 300 400
    L 290 420
  "></path>

  <!-- Pierna izquierda -->
  <path class="outline" d="
    M 180 520
    L 170 640
    Q 165 700 165 740
    Q 165 760 180 770
    L 190 770
  "></path>

  <!-- Pierna derecha -->
  <path class="outline" d="
    M 220 520
    L 230 640
    Q 235 700 235 740
    Q 235 760 220 770
    L 210 770
  "></path>
</svg>
